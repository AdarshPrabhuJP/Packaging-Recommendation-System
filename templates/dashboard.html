<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - Packaging Recommendation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">📊 Analytics Dashboard</span>
            <a href="/" class="btn btn-light btn-sm">← Back to Home</a>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- Key Metrics Cards -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card metric-card">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-muted">Total Materials</h6>
                        <h2 class="card-title" id="totalMaterials">--</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-muted">CO₂ Saved</h6>
                        <h2 class="card-title text-success" id="co2Saved">--</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-muted">Cost Saved</h6>
                        <h2 class="card-title text-primary" id="costSaved">--</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-muted">Eco-Friendly %</h6>
                        <h2 class="card-title text-info" id="ecoPercent">--</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">CO₂ Reduction Analysis</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="co2Chart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Cost Savings Analysis</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="costChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Material Trends Row -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">Material Categories</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="materialPieChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="mb-0">Sustainability Distribution</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="sustainabilityChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Export Section -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Export Reports</h5>
                    </div>
                    <div class="card-body text-center">
                        <a href="/api/export/pdf" class="btn btn-danger btn-lg me-3">
                            📄 Download PDF Report
                        </a>
                        <a href="/api/export/excel" class="btn btn-success btn-lg">
                            📊 Download Excel Data
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
